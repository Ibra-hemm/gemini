<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع إبراهيم ملحم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #2c3e50;
        }
        h2 {
            color: #2980b9;
        }
        p {
            line-height: 1.8;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>أهلاً بك في موقعي</h1>
        <h2>أنا إبراهيم ملحم</h2>
        <p>مهندس طاقة متجددة، أهتم بتصميم أنظمة الطاقة الشمسية وتطوير حلول التنظيف الآلي للخلايا والمحاكاة الهندسية.</p>
        <p>هذا الموقع قيد الإنشاء لعرض مشاريعي وتصاميمي قريباً.</p>
    </div>
</body>
</html>
